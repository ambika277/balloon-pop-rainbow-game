
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Balloon Pop: Rainbow Challenge</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #191b43;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}
</style>
</head>

<body>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let WIDTH = window.innerWidth;
let HEIGHT = window.innerHeight;
let dpr = 1;

function resizeCanvas() {
    WIDTH = window.innerWidth;
    HEIGHT = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = WIDTH * dpr;
    canvas.height = HEIGHT * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ---------------- GAME SETTINGS ----------------

const GAME_DURATION = 60;
const STARTING_LIVES = 5;

let score = 0;
let lives = STARTING_LIVES;
let timeLeft = GAME_DURATION;
let gameState = "menu";

let balloons = [];
let particles = [];
let clouds = [];
let stars = [];

let spawnTimer = 0;
let lastTime = 0;
let elapsedTime = 0;
let bonusEndTime = 0;

// Bright neon balloon colours
const balloonColors = [
    "#ff1493", // Bright pink
    "#bf00ff", // Neon purple
    "#0066ff", // Bright blue
    "#00e5ff", // Cyan
    "#ff4500", // Orange
    "#39ff14", // Neon green
    "#ff3366"  // Bright coral
];

const BONUS_COLOR = "#ffdc45";
const BOMB_COLOR = "#292929";

// ---------------- AUDIO ----------------

let audioCtx = null;

function initAudio() {
    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
    }

    if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function playSound(type) {
    if (!audioCtx) return;

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === "pop") {
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(650, now);
        oscillator.frequency.exponentialRampToValueAtTime(
            250, now + 0.12
        );
    } else if (type === "bonus") {
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(600, now);
        oscillator.frequency.exponentialRampToValueAtTime(
            1200, now + 0.25
        );
    } else if (type === "bomb") {
        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(180, now);
        oscillator.frequency.exponentialRampToValueAtTime(
            50, now + 0.3
        );
    }

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

    oscillator.start(now);
    oscillator.stop(now + 0.3);
}

// ---------------- BACKGROUND ----------------

function createBackground() {
    clouds = [];
    stars = [];

    for (let i = 0; i < 9; i++) {
        clouds.push({
            x: Math.random() * WIDTH,
            y: Math.random() * HEIGHT,
            size: 25 + Math.random() * 35,
            speed: 8 + Math.random() * 10
        });
    }

    for (let i = 0; i < 70; i++) {
        stars.push({
            x: Math.random() * WIDTH,
            y: Math.random() * HEIGHT,
            radius: Math.random() * 1.8 + 0.5,
            alpha: Math.random() * 0.6 + 0.2
        });
    }
}

createBackground();

function drawBackground(dt) {
    const gradient = ctx.createLinearGradient(
        0, 0, 0, HEIGHT
    );

    gradient.addColorStop(0, "#252653");
    gradient.addColorStop(0.55, "#33345F");
    gradient.addColorStop(1, "#171A3D");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Stars
    for (const star of stars) {
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = "#FFFFFF";

        ctx.beginPath();
        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.globalAlpha = 1;

    // Slowly moving clouds
    for (const cloud of clouds) {
        if (gameState === "playing") {
            cloud.x += cloud.speed * dt;

            if (cloud.x > WIDTH + 100) {
                cloud.x = -100;
                cloud.y = Math.random() * HEIGHT;
            }
        }

        drawCloud(cloud);
    }
}

function drawCloud(cloud) {
    const x = cloud.x;
    const y = cloud.y;
    const s = cloud.size;

    ctx.save();
    ctx.fillStyle = "rgba(230, 230, 255, 0.13)";

    ctx.beginPath();
    ctx.arc(x, y, s * 0.45, 0, Math.PI * 2);
    ctx.arc(x + s * 0.4, y - s * 0.2, s * 0.55, 0, Math.PI * 2);
    ctx.arc(x + s * 0.9, y, s * 0.42, 0, Math.PI * 2);
    ctx.arc(x + s * 0.45, y + s * 0.15, s * 0.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// ---------------- BALLOONS ----------------

function createBalloon() {
    const radius = Math.max(
        23,
        Math.min(36, WIDTH * 0.065)
    );

    const random = Math.random();

    let type = "normal";
    let color = balloonColors[
        Math.floor(Math.random() * balloonColors.length)
    ];

    if (random < 0.12) {
        type = "bomb";
        color = BOMB_COLOR;
    } else if (random < 0.23) {
        type = "bonus";
        color = BONUS_COLOR;
    }

    balloons.push({
        x: radius + Math.random() * (WIDTH - radius * 2),
        y: HEIGHT + radius + 10,
        radius: radius,
        color: color,
        type: type,
        speed: 95 + Math.random() * 65 + elapsedTime * 1.2,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 1 + Math.random() * 2
    });
}

function drawBalloon(b) {
    ctx.save();

    const wobbleX = Math.sin(b.wobble) * 5;
    const x = b.x + wobbleX;
    const y = b.y;
    const r = b.radius;

    // Balloon string
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(x, y + r - 2);
    ctx.quadraticCurveTo(
        x + 5,
        y + r + 20,
        x,
        y + r + 38
    );
    ctx.stroke();

    // Balloon body - NO GLOW
    ctx.shadowBlur = 0;
    ctx.fillStyle = b.color;

    ctx.beginPath();
    ctx.ellipse(
        x, y,
        r * 0.78,
        r,
        0, 0, Math.PI * 2
    );
    ctx.fill();

    // White balloon outline
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.ellipse(
        x, y,
        r * 0.78,
        r,
        0, 0, Math.PI * 2
    );
    ctx.stroke();

    // Main white highlight
    ctx.fillStyle = "rgba(255,255,255,0.75)";

    ctx.beginPath();
    ctx.ellipse(
        x - r * 0.25,
        y - r * 0.35,
        r * 0.13,
        r * 0.28,
        -0.4,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Small highlight
    ctx.fillStyle = "rgba(255,255,255,0.35)";

    ctx.beginPath();
    ctx.arc(
        x + r * 0.25,
        y - r * 0.2,
        r * 0.09,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Balloon knot
    ctx.fillStyle = b.color;

    ctx.beginPath();
    ctx.moveTo(x - 6, y + r - 2);
    ctx.lineTo(x + 6, y + r - 2);
    ctx.lineTo(x, y + r + 8);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Bonus star
    if (b.type === "bonus") {
        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${r * 0.8}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("★", x, y);
    }

    // Bomb symbol
    if (b.type === "bomb") {
        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${r * 0.8}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("✹", x, y);
    }

    ctx.restore();
}

// ---------------- PARTICLES ----------------

function createParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 180;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.5,
            maxLife: 1,
            size: 3 + Math.random() * 5,
            color: color
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 100 * dt;
        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

// ---------------- GAME LOGIC ----------------

function startGame() {
    initAudio();

    score = 0;
    lives = STARTING_LIVES;
    timeLeft = GAME_DURATION;
    elapsedTime = 0;
    spawnTimer = 0;
    bonusEndTime = 0;

    balloons = [];
    particles = [];

    gameState = "playing";
}

function endGame() {
    if (gameState !== "playing") return;
    gameState = "gameover";
}

function updateGame(dt) {
    if (gameState !== "playing") return;

    elapsedTime += dt;
    timeLeft -= dt;

    if (timeLeft <= 0) {
        timeLeft = 0;
        endGame();
        return;
    }

    spawnTimer += dt;

    const spawnInterval = Math.max(
        0.38,
        0.85 - elapsedTime * 0.006
    );

    if (spawnTimer >= spawnInterval) {
        createBalloon();
        spawnTimer = 0;
    }

    for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];

        b.y -= b.speed * dt;
        b.wobble += b.wobbleSpeed * dt;

        // Missing balloons do not reduce lives
        if (b.y < -b.radius - 45) {
            balloons.splice(i, 1);
        }
    }

    updateParticles(dt);
}

// ---------------- BALLOON POPPING ----------------

function popBalloon(index) {
    const b = balloons[index];

    if (!b) return;

    createParticles(b.x, b.y, b.color);

    if (b.type === "normal") {
        const multiplier =
            elapsedTime < bonusEndTime ? 2 : 1;

        score += 10 * multiplier;
        playSound("pop");
    }

    if (b.type === "bonus") {
        score += 25;
        bonusEndTime = elapsedTime + 5;
        playSound("bonus");
    }

    if (b.type === "bomb") {
        lives--;
        playSound("bomb");

        if (lives <= 0) {
            lives = 0;
        }
    }

    balloons.splice(index, 1);

    if (lives <= 0) {
        endGame();
    }
}

// ---------------- UI ----------------

function drawText(text, x, y, size, color, align = "center") {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
}

function drawButton(text, x, y, w, h) {
    ctx.save();

    ctx.fillStyle = "#ffdc45";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 16);
    ctx.fill();
    ctx.stroke();

    drawText(text, x + w / 2, y + h / 2, 20, "#29244D");

    ctx.restore();
}

function drawHUD() {
    ctx.fillStyle = "rgba(12, 14, 45, 0.55)";

    ctx.beginPath();
    ctx.roundRect(12, 12, WIDTH - 24, 55, 15);
    ctx.fill();

    drawText("Score: " + score, 25, 40, 18, "#FFFFFF", "left");
    drawText("❤️ " + lives, WIDTH / 2, 40, 18, "#FFFFFF");

    drawText(
        "⏱ " + Math.ceil(timeLeft),
        WIDTH - 80,
        40,
        18,
        "#FFFFFF"
    );

    // Pause button
    ctx.fillStyle = "#ffdc45";

    ctx.beginPath();
    ctx.roundRect(WIDTH - 53, 78, 40, 40, 10);
    ctx.fill();

    drawText("Ⅱ", WIDTH - 33, 98, 22, "#29244D");

    if (elapsedTime < bonusEndTime) {
        drawText(
            "DOUBLE SCORE!",
            WIDTH / 2,
            95,
            17,
            "#ffdc45"
        );
    }
}

function drawMenu() {
    drawText(
        "BALLOON POP",
        WIDTH / 2,
        HEIGHT * 0.28,
        Math.min(38, WIDTH * 0.09),
        "#FFFFFF"
    );

    drawText(
        "RAINBOW CHALLENGE",
        WIDTH / 2,
        HEIGHT * 0.36,
        19,
        "#ffdc45"
    );

    drawText(
        "Pop balloons and collect points!",
        WIDTH / 2,
        HEIGHT * 0.46,
        16,
        "#FFFFFF"
    );

    drawText(
        "★ Bonus = +25   ✹ Bomb = -1 Life",
        WIDTH / 2,
        HEIGHT * 0.52,
        14,
        "#FFFFFF"
    );

    drawButton(
        "START GAME",
        WIDTH / 2 - 100,
        HEIGHT * 0.63,
        200,
        55
    );

    drawText(
        "60 Seconds • 5 Lives",
        WIDTH / 2,
        HEIGHT * 0.78,
        15,
        "#FFFFFF"
    );
}

function drawPaused() {
    ctx.fillStyle = "rgba(10, 10, 30, 0.72)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    drawText(
        "GAME PAUSED",
        WIDTH / 2,
        HEIGHT * 0.4,
        30,
        "#FFFFFF"
    );

    drawButton(
        "RESUME",
        WIDTH / 2 - 90,
        HEIGHT * 0.52,
        180,
        55
    );
}

function drawGameOver() {
    ctx.fillStyle = "rgba(10, 10, 30, 0.78)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    drawText(
        "GAME OVER",
        WIDTH / 2,
        HEIGHT * 0.34,
        34,
        "#FFFFFF"
    );

    drawText(
        "Your Score: " + score,
        WIDTH / 2,
        HEIGHT * 0.44,
        25,
        "#ffdc45"
    );

    drawButton(
        "PLAY AGAIN",
        WIDTH / 2 - 100,
        HEIGHT * 0.55,
        200,
        55
    );

    drawText(
        "Tap to restart",
        WIDTH / 2,
        HEIGHT * 0.68,
        15,
        "#FFFFFF"
    );
}

// ---------------- DRAW GAME ----------------

function drawGame() {
    for (const b of balloons) {
        drawBalloon(b);
    }

    drawParticles();
    drawHUD();
}

// ---------------- INPUT ----------------

function handlePointerDown(event) {
    event.preventDefault();

    const rect = canvas.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    if (gameState === "menu") {
        startGame();
        return;
    }

    if (gameState === "gameover") {
        startGame();
        return;
    }

    if (gameState === "paused") {
        gameState = "playing";
        return;
    }

    if (gameState !== "playing") return;

    // Pause button
    if (
        x > WIDTH - 65 &&
        x < WIDTH - 5 &&
        y > 70 &&
        y < 125
    ) {
        gameState = "paused";
        return;
    }

    // Check balloon touch
    for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];

        const wobbleX = Math.sin(b.wobble) * 5;
        const dx = x - (b.x + wobbleX);
        const dy = y - b.y;

        const hit =
            (dx * dx) / Math.pow(b.radius * 0.9, 2) +
            (dy * dy) / Math.pow(b.radius * 1.15, 2) <= 1;

        if (hit) {
            popBalloon(i);
            return;
        }
    }
}

canvas.addEventListener("pointerdown", handlePointerDown);

// Keyboard controls
window.addEventListener("keydown", function(event) {
    if (event.key.toLowerCase() === "p") {
        if (gameState === "playing") {
            gameState = "paused";
        } else if (gameState === "paused") {
            gameState = "playing";
        }
    }

    if (
        event.key.toLowerCase() === "r" &&
        gameState === "gameover"
    ) {
        startGame();
    }

    if (event.key === "Escape") {
        if (gameState === "playing") {
            gameState = "paused";
        } else if (gameState === "paused") {
            gameState = "menu";
        }
    }
});

// ---------------- MAIN LOOP ----------------

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;

    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    dt = Math.min(dt, 0.05);

    drawBackground(dt);

    if (gameState === "menu") {
        drawMenu();
    } else if (gameState === "playing") {
        updateGame(dt);
        drawGame();
    } else if (gameState === "paused") {
        drawGame();
        drawPaused();
    } else if (gameState === "gameover") {
        drawGame();
        drawGameOver();
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
</body>
</html>
